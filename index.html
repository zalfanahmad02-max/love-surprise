<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Special For You ❤️</title>

<style>

body{
    margin:0;
    padding:0;
    background:linear-gradient(to bottom, #ff4f81, #ff85a2);
    overflow:hidden;
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:monospace;
    color:white;
}
    
.container{
    text-align:center;
    padding:20px;
}

img{
    width:220px;
    animation: muncul 2s ease;
    border-radius:20px;
}
.text{
    margin-top:20px;
    font-size:22px;
    animation: muncul 2s ease;
}
    
@keyframes jatuh{

    0%{
        transform:translateY(-100px);
        opacity:1;
    }

    100%{
        transform:translateY(120vh);
        opacity:0;
    }

}

  @keyframes muncul{

    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

  }
      
#playBtn{
    position:fixed;
    bottom:30px;
    left:50%;
    transform:translateX(-50%);
    padding:15px 30px;
    border:none;
    border-radius:30px;
    background:white;
    color:#ff4f81;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    z-index:99999;
    box-shadow:0 0 20px rgba(255,255,255,0.7);
} 
    
#intro{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:linear-gradient(to bottom, #ff4f81, #ff85a2);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:999999;
}

.intro-box{
    text-align:center;
    color:white;
}

#startBtn{
    margin-top:20px;
    padding:15px 30px;
    border:none;
    border-radius:30px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    background:white;
    color:#ff4f81;
}
    
</style>
</head>

<body>

<div id="intro">
    <div class="intro-box">
        <h1>❤️ Special For You ❤️</h1>
        <button id="startBtn">▶ START</button>
    </div>
</div>

<div class="container">

    <img id="stiker" src="love1.png">

    <div class="text" id="kata">
        Hai sayangku ❤️
    </div>

</div>

<script>

const data = [

{
    gambar:"love1.png",
    kata:"Hai sayangku ❤️"
},

{
    gambar:"love2.png",
    kata:"Akyu mau bilang sesuatu ke ayang"
},

{
    gambar:"love3.png",
    kata:"Selamat hari ulang tahun sayang ku❤️"
},

{
    gambar:"love4.png",
    kata:"Tidak terasa sekarang ayang udh besar udh umur 19 ❤️"
},

{
    gambar:"love5.png",
    kata:"I Love You ❤️"
},

{
    gambar:"love6.png",
    kata:"Seomoga dengan bertambahnya usia ayang ini ayang bisa menjadi pribadi yang lebih baik lagi yaa ❤️"
},

{
    gambar:"love7.png",
    kata:"Maaf yaa sayang blom ad hadiah yang bisa ku kasih ke ayang ❤️"
},

{
    gambar:"love8.png",
    kata:"Maaf jg yaa sayang kalau sy banyak sekali marah ke ayang ❤️"
},

{
    gambar:"love9.png",
    kata:"Sy berharap ayang selalu sayang sy, dan sy jg akan selalu sayang jg ke ayang ❤️"
},

{
    gambar:"love11.png",
    kata:"I LOVE YOU SAYANG KUUUUUU ❤️"
}

];

let index = 0;

function nextSlide(){

    index++;

    if(index >= data.length){
        index = 0;
    }

    document.getElementById("stiker").src = data[index].gambar;

    document.getElementById("kata").innerHTML = data[index].kata;

}

setInterval(nextSlide, 5000);

</script>
<script>

function createHeart(){

    const heart = document.createElement("div");

    heart.innerHTML = "❤️";

    heart.style.position = "fixed";

    heart.style.left = Math.random() * 100 + "vw";

    heart.style.top = "-50px";

    heart.style.fontSize = (20 + Math.random() * 30) + "px";

    heart.style.animation = "jatuh 6s linear forwards";

    heart.style.pointerEvents = "none";

    heart.style.zIndex = "999";

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 6000);

}

setInterval(createHeart, 400);

</script>

<audio id="musik" loop>
  <source src="https://raw.githubusercontent.com/USERNAME/REPO/main/yung%20kai%20-%20blue%20official%20audio.mp3" type="audio/mpeg">
</audio>

<button id="playBtn">▶ PLAY MUSIC ❤️</button>

<script>

const intro = document.getElementById("intro");
const startBtn = document.getElementById("startBtn");
const musik = document.getElementById("musik");
const playBtn = document.getElementById("playBtn");

// START BUTTON
startBtn.addEventListener("click", async () => {

    intro.style.display = "none";
    
    musik.load();
    
    musik.volume = 0.3;

    try {
        await musik.play();
        console.log("musik jalan");
    } catch (error) {
        console.log(error);
    }

});
// PLAY BUTTON (optional)
playBtn.addEventListener("click", async () => {

    musik.volume = 0.3;

    try {
        if (musik.paused) {
            await musik.play();
        } else {
            musik.pause();
        }
    } catch (error) {
        console.log(error);
    }

});
</script>

</body>
</html>
