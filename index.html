<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Special For You ❤️</title>

<style>

body{
    margin:0;
    padding:0;
    background:black;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:monospace;
    color:white;
}

.container{
    text-align:center;
    padding:20px;
}

img{
    width:220px;
    animation: muncul 1s ease;
    border-radius:20px;
}

.text{
    margin-top:20px;
    font-size:22px;
    animation: muncul 1s ease;
}

@keyframes muncul{
    from{
        opacity:0;
        transform:translateY(30px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

</style>
</head>

<body>

<div class="container">

    <img id="stiker" src="love1.png">

    <div class="text" id="kata">
        Hai cantik ❤️
    </div>

</div>

<script>

const data = [

{
    gambar:"love1.png",
    kata:"Hai sayangku ❤️"
},

{
    gambar:"love2.png",
    kata:"Makasih ya udah hadir di hidup aku 🥺"
},

{
    gambar:"love3.png",
    kata:"Aku bersyukur banget bisa kenal kamu ❤️"
},

{
    gambar:"love4.png",
    kata:"Semoga kita selalu bareng yaa 😭"
},

{
    gambar:"love5.png",
    kata:"I Love You ❤️"
}

];

let index = 0;

function nextSlide(){

    index++;

    if(index >= data.length){
        index = 0;
    }

    document.getElementById("stiker").src = data[index].gambar;

    document.getElementById("kata").innerHTML = data[index].kata;

}

setInterval(nextSlide, 3000);

</script>

</body>
</html>
