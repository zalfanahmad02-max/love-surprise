<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Special For You ❤️</title>

<style>

body{
    margin:0;
    padding:0;
    background:linear-gradient(to bottom, #ff4f81, #ff85a2);
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:monospace;
    color:white;
}

.container{
    text-align:center;
    padding:20px;
}

img{
    width:220px;
    animation: muncul 2s ease;
    border-radius:20px;
}

@keyframes jatuh{

    0%{
        transform:translateY(-100px);
        opacity:1;
    }

    100%{
        transform:translateY(120vh);
        opacity:0;
    }

}

.text{
    margin-top:20px;
    font-size:22px;
    animation: muncul 2s ease;
}
  @keyframes muncul{

    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

} 
    
</style>
</head>

<body>

<div class="container">

    <img id="stiker" src="love1.png">

    <div class="text" id="kata">
        Hai sayangku ❤️
    </div>

</div>

<script>

const data = [

{
    gambar:"love1.png",
    kata:"Hai sayangku ❤️"
},

{
    gambar:"love2.png",
    kata:"Akyu mau bilang sesuatu ke ayang"
},

{
    gambar:"love3.png",
    kata:"Selamat hari ulang tahun sayang ku❤️"
},

{
    gambar:"love4.png",
    kata:"Tidak terasa sekarang ayang udh besar udh umur 19 ❤️"
},

{
    gambar:"love5.png",
    kata:"I Love You ❤️"
},

{
    gambar:"love6.png",
    kata:"Seomoga dengan bertambahnya usia ayang ini ayang bisa menjadi pribadi yang lebih baik lagi yaa ❤️"
},

{
    gambar:"love7.png",
    kata:"Maaf yaa sayang blom ad hadiah yang bisa ku kasih ke ayang ❤️"
},

{
    gambar:"love8.png",
    kata:"Maaf jg yaa sayang kalau sy banyak sekali marah ke ayang ❤️"
},

{
    gambar:"love9.png",
    kata:"Sy berharap ayang selalu sayang sy, dan sy jg akan selalu sayang jg ke ayang ❤️"
},

{
    gambar:"love11.png",
    kata:"I LOVE YOU SAYANG KUUUUUU ❤️"
}

];

let index = 0;

function nextSlide(){

    index++;

    if(index >= data.length){
        index = 0;
    }

    document.getElementById("stiker").src = data[index].gambar;

    document.getElementById("kata").innerHTML = data[index].kata;

}

setInterval(nextSlide, 5000);

</script>
<script>

function createHeart(){

    const heart = document.createElement("div");

    heart.innerHTML = "❤️";

    heart.style.position = "fixed";

    heart.style.left = Math.random() * 100 + "vw";

    heart.style.top = "-50px";

    heart.style.fontSize = (20 + Math.random() * 30) + "px";

    heart.style.animation = "jatuh 6s linear forwards";

    heart.style.pointerEvents = "none";

    heart.style.zIndex = "999";

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 6000);

}

setInterval(createHeart, 400);

</script>

<audio id="musik" auotoplay loop>
    <source src="lagu.mp3" type="audio/mp3">
</audio>

<script>

document.body.addEventListener("click", function(){

    document.getElementById("musik").play();

});

</script>

</body>
</html>
