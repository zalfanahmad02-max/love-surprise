<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Special For You ❤️</title>

<style>

body{
    margin:0;
    padding:0;
    background:black;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:monospace;
    color:white;
}

.container{
    text-align:center;
    padding:20px;
}

img{
    width:220px;
    animation: muncul 2s ease;
    border-radius:20px;
}

.text{
    margin-top:20px;
    font-size:22px;
    animation: muncul 2s ease;
}

@keyframes muncul{
    from{
        opacity:0;
        transform:translateY(30px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

</style>
</head>

<body>

<div class="container">

    <img id="stiker" src="love1.png">

    <div class="text" id="kata">
        Hai cantik ❤️
    </div>

</div>

<script>

const data = [

{
    gambar:"love1.png",
    kata:"Hai sayangku ❤️"
},

{
    gambar:"love2.png",
    kata:"Akyu mau bilang sesuatu ke ayang"
},

{
    gambar:"love3.png",
    kata:"Selamat hari ulang tahun sayang ku❤️"
},

{
    gambar:"love4.png",
    kata:"Tidak terasa sekarang ayang udh besar udh umur 19 ❤️"
},

{
    gambar:"love5.png",
    kata:"I Love You ❤️"
},

{
    gambar:"love6.png",
    kata:"Seomoga dengan bertambahnya usia ayang ini ayang bisa menjadi pribadi yang lebih baik lagi yaa ❤️"
},

{
    gambar:"love7.png",

{

let index = 0;

function nextSlide(){

    document.getElementById("kata").innerHTML = data[index].kata;

}

setInterval(nextSlide, 10000);

</script>

</body>
</html>
