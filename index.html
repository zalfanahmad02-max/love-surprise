<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Special For You ❤️</title>

<style>

body{
    margin:0;
    padding:0;
    background:black;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:monospace;
    color:white;
}

.container{
    text-align:center;
    padding:20px;
}

img{
    width:220px;
    animation: muncul 2s ease;
    border-radius:20px;
}

.text{
    margin-top:20px;
    font-size:22px;
    animation: muncul 2s ease;
}
#opening{
    position:fixed;
    width:100%;
    height:100vh;
    background:linear-gradient(to bottom, #ffb6c1, #ffc0cb);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:999;
    animation:hilang 3s forwards;
    animation-delay:4s;
}

#opening h1{
    font-size:40px;
    color:white;
}

#opening p{
    color:#aaa;
    margin-top:10px;
}

@keyframes hilang{
    to{
        opacity:0;
        visibility:hidden;
    }
}
    
@keyframes muncul{
    from{
        opacity:0;
        transform:translateY(30px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
    body::before{
    content:"❤️ ❤️ ❤️ ❤️ ❤️";
    position:absolute;
    top:20px;
    width:100%;
    text-align:center;
    font-size:30px;
    animation:gerakLove 3s infinite alternate;
}

@keyframes gerakLove{
    from{
        transform:translateY(0);
    }

    to{
        transform:translateY(10px);
    }
}

</style>
</head>

<body>

<div class="container">

    <img id="stiker" src="love1.png">

    <div class="text" id="kata">
        Hai cantik ❤️
    </div>

</div>

<script>

const data = [

{
    gambar:"love1.png",
    kata:"Hai sayangku ❤️"
},

{
    gambar:"love2.png",
    kata:"Akyu mau bilang sesuatu ke ayang"
},

{
    gambar:"love3.png",
    kata:"Selamat hari ulang tahun sayang ku❤️"
},

{
    gambar:"love4.png",
    kata:"Tidak terasa sekarang ayang udh besar udh umur 19 ❤️"
},

{
    gambar:"love5.png",
    kata:"I Love You ❤️"
},

{
    gambar:"love6.png",
    kata:"Seomoga dengan bertambahnya usia ayang ini ayang bisa menjadi pribadi yang lebih baik lagi yaa ❤️"
},

{
    gambar:"love7.png",
    kata:"Maaf yaa sayang blom ad hadiah yang bisa ku kasih ke ayang ❤️"
},

{
    gambar:"love8.png",
    kata:"Maaf jg yaa sayang kalau sy banyak sekali marah ke ayang ❤️"
},

{
    gambar:"love9.png",
    kata:"Sy berharap ayang selalu sayang sy, dan sy jg akan selalu sayang jg ke ayang ❤️"
},

{
    gambar:"love11.png",
    kata:"I LOVE YOU SAYANG KUUUUUU ❤️"

];

let index = 0;

function nextSlide(){

    index++;

    if(index >= data.length){
        index = 0;
    }

    document.getElementById("stiker").src = data[index].gambar;

    document.getElementById("kata").innerHTML = data[index].kata;

}

setInterval(nextSlide, 5000);

</script>

</body>
</html>
<script>

function createHeart(){

    const heart = document.createElement("div");

    heart.innerHTML = "❤️";

    heart.style.position = "fixed";

    heart.style.left = Math.random() * 100 + "vw";

    heart.style.top = "-20px";

    heart.style.fontSize = (20 + Math.random() * 30) + "px";

    heart.style.animation = "jatuh 5s linear";

    heart.style.zIndex = "999";

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 5000);

}

setInterval(createHeart, 300);

</script>
